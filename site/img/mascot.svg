<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- original one-eyed devil sprite for guix-toys -->
  <g stroke="#000" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <!-- horns -->
    <path d="M22 34 L8 10 L34 22 Z" fill="#b3001b"/>
    <path d="M78 34 L92 10 L66 22 Z" fill="#b3001b"/>
    <!-- head: rough, hand-cut blob -->
    <path d="M24 32
             C18 40 14 52 17 64
             C20 77 31 88 50 89
             C69 88 80 77 83 64
             C86 52 82 40 76 32
             C68 24 60 21 50 21
             C40 21 32 24 24 32 Z"
          fill="#b3001b"/>
    <!-- single big eye -->
    <ellipse cx="50" cy="49" rx="17" ry="18" fill="#e8e2d6"/>
    <circle cx="50" cy="52" r="7.5" fill="#000" stroke="none"/>
    <circle cx="53" cy="49" r="2.4" fill="#e8e2d6" stroke="none"/>
    <!-- angry brow -->
    <path d="M31 31 L69 37" fill="none" stroke-width="5"/>
    <!-- jagged grin -->
    <path d="M30 70 L37 75 L42 69 L48 76 L54 69 L60 75 L66 68 L70 71"
          fill="none" stroke="#e0a500" stroke-width="4"/>
  </g>
</svg>
