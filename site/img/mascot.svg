<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- original one-eyed punk gnu for guix-toys (no Guix logo paths reused) -->
  <g stroke="#000" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <!-- one continuous silhouette: flared horn tips sweeping into a V-tapered head -->
    <path d="M4 9
             C8 23 17 32 28 35
             C25 45 27 57 33 68
             C38 78 44 86 50 92
             C56 86 62 78 67 68
             C73 57 75 45 72 35
             C83 32 92 23 96 9
             C90 19 83 25 73 26
             C66 21 58 19 50 19
             C42 19 34 21 27 26
             C17 25 10 19 4 9 Z"
          fill="#e0a500"/>
    <!-- shaggy red forelock between the horns -->
    <path d="M38 23 L42 14 L47 22 L50 12 L53 22 L58 14 L62 23"
          fill="#b3001b"/>
    <!-- single big cyclops eye -->
    <ellipse cx="50" cy="42" rx="14" ry="13" fill="#e8e2d6"/>
    <circle cx="50" cy="44" r="6" fill="#000" stroke="none"/>
    <circle cx="53" cy="41" r="2" fill="#e8e2d6" stroke="none"/>
    <!-- angry brow -->
    <path d="M36 27 L64 30" fill="none" stroke-width="5"/>
    <!-- red muzzle patch tapering with the chin -->
    <path d="M38 60
             C36 70 42 80 50 86
             C58 80 64 70 62 60
             C58 57 54 56 50 56
             C46 56 42 57 38 60 Z"
          fill="#b3001b"/>
    <!-- jagged grin -->
    <path d="M40 66 L45 71 L50 65 L55 71 L60 66"
          fill="none" stroke="#e0a500" stroke-width="3.5"/>
    <!-- nostrils -->
    <circle cx="45" cy="60" r="1.5" fill="#000" stroke="none"/>
    <circle cx="55" cy="60" r="1.5" fill="#000" stroke="none"/>
  </g>
</svg>
