name: Build & Deploy

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      channels_file:
        description: 'Channels file to index (use channels-test.scm for smoke runs)'
        required: false
        default: 'channels.scm'
  push:
    branches: [main]
    # site/-only changes are handled by the fast deploy-site.yml instead.
    paths-ignore:
      - 'site/**'
      - 'README.md'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-build
  cancel-in-progress: false

jobs:
  build:
    # Skip the duplicate run triggered by the channels-sync commit we push ourselves.
    if: "${{ github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'channels: Sync') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Sync channels.scm from upstream
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          curl -fsSL https://git.sr.ht/~whereiseveryone/toys/blob/master/channels.scm -o channels.scm
          if git diff --quiet channels.scm; then
            echo "channels.scm is up to date"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add channels.scm
            git commit -m "channels: Sync from upstream"
            git push origin main
          fi

      - name: Apply local channels.scm fixes
        # Post-sync, uncommitted: survives the weekly upstream sync. Drop
        # each line once the corresponding patch lands upstream.
        run: |
          # trevdev moved to Codeberg (sr.ht repo is a tombstone README)
          sed -i 's|https://git.sr.ht/~trevdev/guix-channel|https://codeberg.org/trevdev/guix-channel|' channels.scm

      - name: Install Guix
        uses: PromyLOPh/guix-install-action@v1.6
        with:
          pullAfterInstall: false

      - name: Cache Guix checkouts
        uses: actions/cache@v4
        with:
          path: ~/.cache/guix/checkouts
          key: guix-checkouts-${{ hashFiles('channels.scm') }}
          restore-keys: |
            guix-checkouts-

      - name: Index channels
        run: |
          set -uo pipefail
          FILE="${{ inputs.channels_file || 'channels.scm' }}"
          echo "Indexing channels from $FILE"

          guix shell -m manifest.scm -- ./dev init

          channels=$(grep -oP "\(name '\K[a-zA-Z0-9*+_-]+" "$FILE" | sort -u)
          total=$(echo "$channels" | wc -l)
          echo "Found $total channels"

          i=0
          for ch in $channels; do
            i=$((i + 1))
            start=$(date +%s)
            echo "::group::[$i/$total] $ch"
            if ! timeout 20m guix shell -m manifest.scm -- ./dev pull "$FILE" "$ch"; then
              echo "::warning::channel $ch failed"
            fi
            echo "[$i/$total] $ch took $(( $(date +%s) - start ))s"
            echo "::endgroup::"
          done

      - name: Post-process DB
        run: |
          set -euo pipefail
          DB="$HOME/.cache/guix/toys/db.sqlite"
          sql() { guix shell sqlite -- sqlite3 "$DB" "$@"; }

          # Rebuild the FTS table for httpvfs: drop the (never-searched)
          # description column so content rows are tiny, and encode
          # table/name-length/join-key into the rowid (code*1e14 + len*1e11
          # + fk) so the frontend can stream shortest-name-first results
          # straight from the FTS index with no content reads and no ORDER
          # BY rank (which intermittently wedges the WASM SQLite).
          # Indexes + toys_counts keep lookups and browse counts off the
          # big tables. Keep in sync with site/js/queries.js.
          sql <<'SQL'
          BEGIN;
          CREATE VIRTUAL TABLE search_new USING fts5(name, fk, channel, `table`, prefix='1 2 3');
          INSERT INTO search_new(rowid, name, fk, channel, `table`)
            SELECT CASE s.`table`
                     WHEN 'packages'       THEN 100000000000000
                     WHEN 'service_types'  THEN 200000000000000
                     WHEN 'public_symbols' THEN 300000000000000
                     ELSE 400000000000000
                   END
                   + MIN(LENGTH(s.name), 999) * 100000000000
                   + CASE s.`table` WHEN 'boxes' THEN s.rowid ELSE CAST(s.fk AS INTEGER) END,
                   s.name, s.fk, s.channel, s.`table`
            FROM search s;
          DROP TABLE search;
          ALTER TABLE search_new RENAME TO search;

          CREATE INDEX IF NOT EXISTS idx_packages_channel_name ON packages(channel, name);
          CREATE INDEX IF NOT EXISTS idx_packages_name ON packages(name);
          CREATE INDEX IF NOT EXISTS idx_service_types_channel_name ON service_types(channel, name);
          CREATE INDEX IF NOT EXISTS idx_service_types_name ON service_types(name);
          CREATE INDEX IF NOT EXISTS idx_public_symbols_channel_name ON public_symbols(channel, name);
          CREATE INDEX IF NOT EXISTS idx_public_symbols_name ON public_symbols(name);

          DROP TABLE IF EXISTS toys_counts;
          CREATE TABLE toys_counts (
            tbl TEXT NOT NULL,
            channel TEXT NOT NULL DEFAULT '',
            n INTEGER NOT NULL,
            PRIMARY KEY (tbl, channel)
          ) WITHOUT ROWID;
          INSERT INTO toys_counts
            SELECT 'packages', channel, COUNT(*) FROM packages GROUP BY channel
            UNION ALL SELECT 'packages', '', COUNT(*) FROM packages
            UNION ALL SELECT 'service_types', channel, COUNT(*) FROM service_types GROUP BY channel
            UNION ALL SELECT 'service_types', '', COUNT(*) FROM service_types
            UNION ALL SELECT 'public_symbols', channel, COUNT(*) FROM public_symbols GROUP BY channel
            UNION ALL SELECT 'public_symbols', '', COUNT(*) FROM public_symbols
            UNION ALL SELECT 'boxes', '', COUNT(*) FROM boxes;
          COMMIT;
          SQL

          sql "INSERT INTO search(search) VALUES('optimize'); ANALYZE;"
          sql "PRAGMA journal_mode=DELETE; PRAGMA page_size=16384; VACUUM;"

          check=$(sql "PRAGMA integrity_check;")
          if [ "$check" != "ok" ]; then
            echo "::error::integrity_check failed: $check"
            exit 1
          fi

          # Schema tripwire: assert the tables/columns the frontend depends on.
          assert_columns() {
            table="$1"; shift
            cols=$(sql "SELECT name FROM pragma_table_info('$table');")
            if [ -z "$cols" ]; then
              echo "::error::table $table is missing"
              exit 1
            fi
            for col in "$@"; do
              if ! echo "$cols" | grep -qx "$col"; then
                echo "::error::table $table is missing column $col"
                exit 1
              fi
            done
          }
          assert_columns packages name channel module file url version homepage \
            licenses synopsis inputs propagated_inputs origin description build_system
          assert_columns service_types name channel module file url description
          assert_columns public_symbols name channel module file url doc signature
          assert_columns boxes id branch commit url synopsis subscription_snippet
          if [ "$(sql "SELECT count(*) FROM sqlite_master WHERE name='search';")" = "0" ]; then
            echo "::error::FTS table 'search' is missing"
            exit 1
          fi
          # functional probe of the encoded-rowid join the frontend relies on
          probe=$(sql 'SELECT j.name FROM (SELECT rowid AS rid FROM search WHERE search MATCH '"'"'table: "packages" AND name: "a" *'"'"' ORDER BY rowid LIMIT 1) m JOIN packages j ON j.id = (m.rid % 100000000000);')
          if [ -z "$probe" ]; then
            echo "::error::encoded-rowid FTS join probe returned nothing"
            exit 1
          fi

          size=$(stat -c%s "$DB")
          echo "DB size: $size bytes"
          if [ "$size" -le 100000 ]; then
            echo "::error::DB is suspiciously small ($size bytes)"
            exit 1
          fi

      - name: Assemble Pages artifact
        run: |
          set -euo pipefail
          # minute resolution: same-day redeploys must not reuse a filename
          # (the CDN would mix ranges of old and new bytes)
          STAMP=$(date +%Y%m%d%H%M)
          rm -rf site/db
          mkdir -p site/db
          # The .png extension is load-bearing: Pages gzips octet-stream (and
          # applies Range requests to the *compressed* object, corrupting
          # httpvfs reads), but never compresses image types.
          cp "$HOME/.cache/guix/toys/db.sqlite" "site/db/db-$STAMP.sqlite.png"
          # static channel list so the UI is interactive before the DB boots
          guix shell sqlite -- sqlite3 -json "site/db/db-$STAMP.sqlite.png" \
            "SELECT id FROM boxes ORDER BY id" | \
            guix shell jq -- jq -c 'map(.id)' > site/db/channels.json
          cat > site/db/config.json <<EOF
          {
            "from": "inline",
            "config": {
              "serverMode": "full",
              "url": "db-$STAMP.sqlite.png",
              "requestChunkSize": 16384
            }
          }
          EOF
          touch site/.nojekyll
          ls -lR site/db

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
